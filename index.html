<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso Excavaciones Oil & Gas</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f6f9}header{background:#063b5b;color:#fff;padding:20px}#wrap{display:flex}#menu{width:280px;background:#e9eef2;padding:10px;height:100vh;overflow:auto}#content{flex:1;padding:20px;background:#fff}button.m{width:100%;padding:10px;margin:4px 0;border:none;background:#0f766e;color:#fff;border-radius:6px} .card{background:#eef6ff;padding:12px;border-radius:8px;margin:10px 0}.quiz{background:#fff8dc;padding:12px;border-radius:8px}.bar{background:#ddd;height:20px;border-radius:10px}.fill{background:#16a34a;height:20px;width:0%;border-radius:10px}</style></head><body><header><h1>Seguridad en Excavaciones para Oil & Gas</h1><p>Curso autogestionado con evaluación final</p><div class="bar"><div id="fill" class="fill"></div></div></header><div id="wrap"><div id="menu"></div><div id="content"></div></div><script>const mods=[{t:'Inicio',c:'<h2>Bienvenido</h2><p>Objetivos del curso, alcance y certificación.</p>'},{t:'M1 Introducción',c:'<h2>Introducción</h2><div class=card><b>Narración:</b> Las excavaciones son una actividad crítica por riesgo de derrumbe.</div><div class=quiz><p>¿Principal causa de fatalidad?</p><button onclick="alert('Correcto: Derrumbes')">Derrumbes</button></div>'},{t:'M2 Peligros',c:'<h2>Peligros</h2><ul><li>Derrumbes</li><li>Atropellos</li><li>Electricidad</li><li>Gases</li></ul>'},{t:'M3 Servicios enterrados',c:'<h2>Servicios enterrados</h2><p>Uso de planos, GPR y detectores.</p>'},{t:'M4 Suelos',c:'<h2>Clasificación de suelos</h2><p>Tipo A, B y C.</p>'},{t:'M5 Protección',c:'<h2>Taludes, entibaciones y blindajes</h2>'},{t:'M6 Maquinaria',c:'<h2>Equipos y puntos ciegos</h2>'},{t:'M7 Atmósferas',c:'<h2>O2, H2S y LEL</h2>'},{t:'M8 Emergencias',c:'<h2>Respuesta a emergencias</h2>'},{t:'Examen Final',c:'<h2>Examen</h2><p>1. Distancia del material excavado:</p><label><input type=radio name=q1 value=1>60 cm</label><br><label><input type=radio name=q1 value=0>10 cm</label><br><p>2. Suelo más riesgoso:</p><label><input type=radio name=q2 value=1>Tipo C</label><br><label><input type=radio name=q2 value=0>Tipo A</label><br><button onclick="grade()">Calificar</button><div id=r></div>'}];const m=document.getElementById('menu'),c=document.getElementById('content');function show(i){c.innerHTML=mods[i].c;document.getElementById('fill').style.width=((i)/(mods.length-1)*100)+'%';}mods.forEach((x,i)=>{let b=document.createElement('button');b.className='m';b.textContent=x.t;b.onclick=()=>show(i);m.appendChild(b)});function grade(){let s=0;document.querySelectorAll('input[type=radio]:checked').forEach(e=>s+=Number(e.value));let p=s*50;document.getElementById('r').innerHTML=p>=80?'APROBADO '+p+'%':'NO APROBADO '+p+'%';}show(0);</script></body></html>
